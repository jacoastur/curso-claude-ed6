openapi: 3.1.0
info:
  title: Resttek API - Gestión de mesas (issue #5)
  version: 1.0.0
  description: |
    Contrato de la funcionalidad de **gestión de mesas** y de los endpoints de pedidos
    afectados. Es la fuente de verdad compartida por la API y los tres frontends
    (`web-admin`, `web-empleados`, `web-clientes`).

    Convenciones (las mismas que el resto de la API):

    - Todas las rutas cuelgan de `/api/v1`. Los frontends llaman a `/api/...` y el proxy
      de desarrollo lo redirige a `http://localhost:3000`.
    - JSON en `camelCase`. Fechas como cadenas ISO 8601 en UTC (`2026-10-22T10:15:00.000Z`).
    - Identificadores: cadenas (UUID v4 para las mesas creadas por la API; el seed puede usar
      ids legibles). El cliente no debe asumir ningún formato.
    - Autenticación: JWT en `Authorization: Bearer <token>` obtenido con
      `POST /api/v1/auth/login`. El token lleva `id`, `role` y `restaurantId`.
    - Roles: `admin`, `manager`, `camarero`, `cocinero`, `cliente`. Los roles permitidos
      en cada operación se indican en la descripción y en la extensión `x-roles`.
    - Aislamiento por restaurante (`assertRestaurantAccess`): en las rutas privadas de
      mesas el `admin` accede a cualquier restaurante; `manager` y `camarero` solo al
      `restaurantId` de su token (si no, 403).
    - Errores: ver el schema `Error`. Las rutas de mesas pasan por el `errorHandler`
      común y responden `{ error: <NombreDelError>, message }`. Los middlewares de
      autenticación responden solo `{ error: <mensaje> }`. En `POST /orders` los errores
      de dominio responden `{ error: <NombreDelError>, message }` (ver la operación). El
      frontend debe decidir por el **código HTTP** (y, si lo necesita, por el nombre en
      `error`), nunca por el texto de `message`. Los textos de `message` están en inglés,
      como el resto de errores de dominio de la API; la tabla completa está en el schema
      `Error`.
    - Estados de mesa (`TableStatus`): `libre`, `ocupada`, `reservada`. Una mesa la ocupa
      el cliente al elegirla (o un empleado/admin manualmente) y **solo la libera un
      empleado** (`PATCH .../status` con `libre`); no hay liberación automática.

servers:
  - url: http://localhost:3000/api/v1
    description: API local (npm run dev:api)

tags:
  - name: Mesas
    description: Gestión privada de mesas de un restaurante (admin y empleados de sala).
  - name: Mesas públicas
    description: Consulta y ocupación de mesas por parte del cliente (web-clientes).
  - name: Pedidos
    description: Endpoints de pedidos afectados por la asociación con mesas.

security:
  - bearerAuth: []

paths:
  /restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas]
      operationId: listTables
      summary: Listar las mesas de un restaurante
      description: |
        Devuelve todas las mesas del restaurante ordenadas por `number` ascendente.
        Si el restaurante no tiene mesas (o no existe) devuelve `[]`.

        **Roles:** `admin`, `manager`, `camarero` (con aislamiento por restaurante). `cocinero` y `cliente` → 403.
      x-roles: [admin, manager, camarero]
      responses:
        '200':
          description: Lista de mesas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantTable'
              example:
                - id: 6f1c2a9e-3b1d-4c8e-9a51-0d2f7b3e8c11
                  restaurantId: rest-1
                  number: 1
                  description: Ventana
                  capacity: 2
                  status: libre
                  createdAt: '2026-10-22T09:00:00.000Z'
                  updatedAt: '2026-10-22T09:00:00.000Z'
                - id: 0b8e4d72-51a4-4f3a-b7c9-6a2e1f9d4c30
                  restaurantId: rest-1
                  number: 2
                  description: null
                  capacity: 4
                  status: ocupada
                  createdAt: '2026-10-22T09:00:00.000Z'
                  updatedAt: '2026-10-22T10:15:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Mesas]
      operationId: createTable
      summary: Crear una mesa
      description: |
        Crea una mesa en el restaurante. `status` es opcional (por defecto `libre`).
        `description` vacía o solo con espacios se guarda como `null`.

        **Roles:** `admin`.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
            example:
              number: 10
              description: Terraza
              capacity: 4
      responses:
        '201':
          description: Mesa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantTable'
              example:
                id: 9d3a7c5e-2f41-4b6a-8e0d-1c7b5a3f2e99
                restaurantId: rest-1
                number: 10
                description: Terraza
                capacity: 4
                status: libre
                createdAt: '2026-10-22T11:00:00.000Z'
                updatedAt: '2026-10-22T11:00:00.000Z'
        '400':
          description: |
            Datos inválidos o incompletos. Se valida en este orden y se devuelve el primer error:
            `InvalidTableNumberError` (`number` ausente, `null`, no entero o < 1),
            `InvalidTableCapacityError` (`capacity` ausente, `null`, no entera o < 1),
            `InvalidTableStatusError` (`status` presente pero fuera de la lista).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                numeroAusente:
                  value:
                    error: InvalidTableNumberError
                    message: 'Table number must be an integer greater than or equal to 1'
                capacidad:
                  value:
                    error: InvalidTableCapacityError
                    message: 'Table capacity must be an integer greater than or equal to 1'
                estado:
                  value:
                    error: InvalidTableStatusError
                    message: 'Invalid table status: rota. Must be one of: libre, ocupada, reservada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'

  /restaurants/{restaurantId}/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Mesas]
      operationId: getTable
      summary: Obtener una mesa
      description: |
        Devuelve la mesa si existe **y pertenece** a `restaurantId`; si no, 404.

        **Roles:** `admin`, `manager`, `camarero` (con aislamiento por restaurante).
      x-roles: [admin, manager, camarero]
      responses:
        '200':
          description: Mesa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
    put:
      tags: [Mesas]
      operationId: updateTable
      summary: Modificar una mesa
      description: |
        Reemplaza los datos editables de la mesa. `number`, `capacity` y `status` son
        **obligatorios**; `description` es opcional: ausente, `null`, vacía o solo con
        espacios → se guarda `null` (es decir, omitirla **borra** la descripción). El
        cambio de número comprueba la unicidad dentro del restaurante (la propia mesa no
        cuenta como duplicada).

        **Roles:** `admin`.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableRequest'
            example:
              number: 10
              description: Terraza cubierta
              capacity: 6
              status: reservada
      responses:
        '200':
          description: Mesa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantTable'
        '400':
          description: |
            Datos inválidos o incompletos. Se valida en este orden y se devuelve el primer error:
            `InvalidTableNumberError` (`number` ausente, `null`, no entero o < 1),
            `InvalidTableCapacityError` (`capacity` ausente, `null`, no entera o < 1),
            `InvalidTableStatusError` (`status` ausente, `null` o fuera de la lista;
            si falta, `message` es `Table status is required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: InvalidTableNumberError
                message: 'Table number must be an integer greater than or equal to 1'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'
    delete:
      tags: [Mesas]
      operationId: deleteTable
      summary: Borrar una mesa
      description: |
        Borra la mesa. No se puede borrar una mesa `ocupada` (409); las `libre` y
        `reservada` sí. Los pedidos antiguos de la mesa se conservan (su `tableNumber`
        dejará de devolverse).

        **Roles:** `admin`.
      x-roles: [admin]
      responses:
        '204':
          description: Mesa borrada (sin cuerpo).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: La mesa está ocupada (`TableOccupiedError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: TableOccupiedError
                message: 'Cannot delete an occupied table'

  /restaurants/{restaurantId}/tables/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    patch:
      tags: [Mesas]
      operationId: changeTableStatus
      summary: Cambiar el estado de una mesa
      description: |
        Cambia solo el estado. Se permite cualquier transición entre `libre`, `ocupada`
        y `reservada` (incluido liberar una mesa ocupada → `libre`, o fijar el mismo
        estado que ya tiene). Es la única forma de liberar una mesa.

        **Roles:** `admin`, `manager`, `camarero` (con aislamiento por restaurante).
      x-roles: [admin, manager, camarero]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTableStatusRequest'
            example:
              status: libre
      responses:
        '200':
          description: Mesa con el estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantTable'
              example:
                id: 0b8e4d72-51a4-4f3a-b7c9-6a2e1f9d4c30
                restaurantId: rest-1
                number: 2
                description: null
                capacity: 4
                status: libre
                createdAt: '2026-10-22T09:00:00.000Z'
                updatedAt: '2026-10-22T12:30:00.000Z'
        '400':
          description: |
            `status` ausente/`null` (`message`: `Table status is required`) o fuera de la
            lista (`InvalidTableStatusError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: InvalidTableStatusError
                message: 'Invalid table status: rota. Must be one of: libre, ocupada, reservada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'

  /public/restaurants/{restaurantId}/tables/available:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas públicas]
      operationId: listAvailableTables
      summary: Mesas libres con capacidad suficiente
      description: |
        Devuelve las mesas `libre` del restaurante con `capacity >= people`, ordenadas
        por `capacity` y luego `number` ascendentes (primero la más ajustada). Versión
        pública reducida: sin estado ni fechas. Si no hay mesas (o el restaurante no
        existe) devuelve `[]`.

        **Roles:** ninguno (pública, sin token).
      x-roles: []
      security: []
      parameters:
        - name: people
          in: query
          required: true
          description: Número de comensales. Entero >= 1.
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        '200':
          description: Mesas disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableTable'
              example:
                - id: 9d3a7c5e-2f41-4b6a-8e0d-1c7b5a3f2e99
                  number: 10
                  description: Terraza
                  capacity: 4
                - id: 3e7f1a2b-8c9d-4e0f-a1b2-c3d4e5f60718
                  number: 5
                  description: Salón principal
                  capacity: 6
        '400':
          description: '`people` ausente, no entero o < 1 (`InvalidPeopleCountError`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: InvalidPeopleCountError
                message: 'People count must be an integer greater than or equal to 1'

  /public/restaurants/{restaurantId}/tables/{id}/occupy:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Mesas públicas]
      operationId: occupyTable
      summary: Ocupar una mesa (cliente)
      description: |
        El cliente ocupa la mesa elegida al pulsar *Continuar*. La operación es atómica:
        solo tiene éxito si la mesa pertenece al restaurante, está `libre` y su
        capacidad es >= `people`. Si dos clientes intentan ocupar la misma mesa, el
        segundo recibe 409 (debe recargar la lista de disponibles).

        **Roles:** `cliente`. Sin token → 401; token de empleado/admin → 403.
      x-roles: [cliente]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupyTableRequest'
            example:
              people: 3
      responses:
        '200':
          description: Mesa ocupada. Se devuelve la mesa completa con `status = ocupada`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantTable'
              example:
                id: 9d3a7c5e-2f41-4b6a-8e0d-1c7b5a3f2e99
                restaurantId: rest-1
                number: 10
                description: Terraza
                capacity: 4
                status: ocupada
                createdAt: '2026-10-22T11:00:00.000Z'
                updatedAt: '2026-10-22T13:05:00.000Z'
        '400':
          description: '`people` ausente, no entero o < 1 (`InvalidPeopleCountError`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: La mesa no está libre o su capacidad es insuficiente (`TableNotAvailableError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: TableNotAvailableError
                message: 'Table is not available'

  /orders:
    post:
      tags: [Pedidos]
      operationId: createOrder
      summary: Crear un pedido (cambia - ahora exige mesa)
      description: |
        Crea un pedido. **Cambio de contrato:** `tableId` pasa a ser obligatorio (no hay
        pedidos para llevar) y se valida en este orden:

        1. Sin `tableId` (ausente, `null` o vacío) → 400 (`TableIdRequiredError`).
        2. La mesa no existe o es de otro restaurante → 404 (`TableNotFoundError`).
        3. La mesa no está `ocupada` → 409 (`TableNotAvailableError`).

        Se admiten varios pedidos para la misma mesa mientras siga ocupada. Cada ítem
        con `quantity: N` se expande en N ítems con `quantity: 1`. El `clientId` se toma
        del token. La respuesta incluye `tableNumber` pero no los datos del plato
        (`dishName`, ...) ni del restaurante.

        **Códigos garantizados** (el frontend decide por código, no por texto):
        400 = falta la mesa o el restaurante, 404 = mesa no encontrada, 409 = mesa no
        ocupada. `OrderController` mantiene su `try/catch`, pero para los errores de
        dominio (`AppError`) responde con el mismo formato que `errorHandler`:
        `{ error: <NombreDelError>, message }`. Solo un error inesperado que no sea de
        dominio responde 400 con `{ error: <mensaje> }`.

        **Roles:** cualquier usuario autenticado (en la práctica `cliente`).
      x-roles: [admin, manager, camarero, cocinero, cliente]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              restaurantId: rest-1
              tableId: 9d3a7c5e-2f41-4b6a-8e0d-1c7b5a3f2e99
              items:
                - dishId: dish-1
                  quantity: 2
                  notes: Sin cebolla
                - dishId: dish-4
                  quantity: 1
                  notes: null
      responses:
        '201':
          description: Pedido creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                restaurantId: rest-1
                tableId: 9d3a7c5e-2f41-4b6a-8e0d-1c7b5a3f2e99
                tableNumber: 10
                clientId: client-1
                createdAt: '2026-10-22T13:10:00.000Z'
                items:
                  - id: 11111111-1111-4111-8111-111111111111
                    dishId: dish-1
                    quantity: 1
                    notes: Sin cebolla
                    status: pendiente
                  - id: 22222222-2222-4222-8222-222222222222
                    dishId: dish-1
                    quantity: 1
                    notes: Sin cebolla
                    status: pendiente
                  - id: 33333333-3333-4333-8333-333333333333
                    dishId: dish-4
                    quantity: 1
                    notes: null
                    status: pendiente
        '400':
          description: |
            Falta `tableId` (`TableIdRequiredError`) o `restaurantId`
            (`RestaurantIdRequiredError`). `restaurantId` se valida primero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinMesa:
                  value:
                    error: TableIdRequiredError
                    message: Table ID is required
                sinRestaurante:
                  value:
                    error: RestaurantIdRequiredError
                    message: Restaurant ID is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La mesa no existe o no pertenece al restaurante del pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: TableNotFoundError
                message: Table not found
        '409':
          description: La mesa no está ocupada (está `libre` o `reservada`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: TableNotAvailableError
                message: Table is not available

  /orders/active:
    get:
      tags: [Pedidos]
      operationId: listActiveOrders
      summary: Pedidos activos de un restaurante (cambia - añade tableNumber)
      description: |
        Pedidos con al menos un ítem no `entregado`, ordenados por `createdAt` ascendente.
        Ahora cada pedido incluye `tableNumber` cuando `tableId` corresponde a una mesa
        existente. Los ítems incluyen `dishName`, `dishPrice` y `dishCategory`.

        **Roles:** cualquier usuario autenticado (sin cambios).
      x-roles: [admin, manager, camarero, cocinero, cliente]
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
          example: rest-1
      responses:
        '200':
          description: Pedidos activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                  restaurantId: rest-1
                  tableId: 0b8e4d72-51a4-4f3a-b7c9-6a2e1f9d4c30
                  tableNumber: 2
                  clientId: client-1
                  createdAt: '2026-10-22T13:10:00.000Z'
                  items:
                    - id: 11111111-1111-4111-8111-111111111111
                      dishId: dish-1
                      quantity: 1
                      notes: null
                      status: preparando
                      dishName: Paella valenciana
                      dishPrice: 14.5
                      dishCategory: principal
                - id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                  restaurantId: rest-1
                  tableId: '5'
                  clientId: null
                  createdAt: '2026-10-21T20:00:00.000Z'
                  items:
                    - id: 44444444-4444-4444-8444-444444444444
                      dishId: dish-2
                      quantity: 1
                      notes: null
                      status: pendiente
                      dishName: Tortilla de patatas
                      dishPrice: 8
                      dishCategory: entrante
        '400':
          description: Falta `restaurantId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: restaurantId is required
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/mine:
    get:
      tags: [Pedidos]
      operationId: listMyOrders
      summary: Pedidos del usuario autenticado (cambia - añade tableNumber)
      description: |
        Pedidos cuyo `clientId` es el usuario del token, del más reciente al más antiguo.
        Incluyen `restaurantName`, `restaurantLogoUrl` y ahora `tableNumber`.

        **Roles:** cualquier usuario autenticado (en la práctica `cliente`).
      x-roles: [admin, manager, camarero, cocinero, cliente]
      responses:
        '200':
          description: Pedidos del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Pedidos]
      operationId: getOrder
      summary: Detalle de un pedido (cambia - añade tableNumber)
      description: |
        Incluye `restaurantName`, `restaurantLogoUrl`, los datos del plato en cada ítem y
        ahora `tableNumber`.

        **Roles:** cualquier usuario autenticado (sin cambios).
      x-roles: [admin, manager, camarero, cocinero, cliente]
      responses:
        '200':
          description: Pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /api/v1/auth/login`. Payload `{ id, role, restaurantId }`.

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Id del restaurante.
      schema:
        type: string
      example: rest-1
    TableId:
      name: id
      in: path
      required: true
      description: Id de la mesa.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Falta el token o no es válido (middleware `authenticate`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Unauthorized: No token provided'
    Forbidden:
      description: |
        El rol no está permitido (`authorize`) o el usuario no pertenece al restaurante
        de la ruta (`assertRestaurantAccess`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Forbidden: Insufficient permissions'
    TableNotFound:
      description: La mesa no existe o no pertenece al restaurante (`TableNotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TableNotFoundError
            message: Table not found
    DuplicatedTableNumber:
      description: Ya existe una mesa con ese número en el restaurante (`DuplicatedTableNumberError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DuplicatedTableNumberError
            message: 'Table number is already in use in this restaurant'

  schemas:
    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
      description: |
        Estado de la mesa. La API acepta mayúsculas y espacios alrededor (los normaliza
        a minúsculas), pero siempre devuelve el valor en minúsculas.

    RestaurantTable:
      type: object
      description: Mesa de un restaurante (vista privada completa).
      required: [id, restaurantId, number, description, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        restaurantId:
          type: string
        number:
          type: integer
          minimum: 1
          description: Número visible de la mesa, único dentro del restaurante.
        description:
          type: [string, 'null']
          description: Texto libre (p. ej. "Terraza"). `null` si no tiene.
        capacity:
          type: integer
          minimum: 1
          description: Número máximo de comensales.
        status:
          $ref: '#/components/schemas/TableStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AvailableTable:
      type: object
      description: Mesa libre en la vista pública para clientes (sin estado ni fechas).
      required: [id, number, description, capacity]
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1
        description:
          type: [string, 'null']
        capacity:
          type: integer
          minimum: 1

    CreateTableRequest:
      type: object
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          description: Obligatorio. Entero JSON >= 1 (ausente, `null` o cadenas como `"4"` → 400 `InvalidTableNumberError`).
        description:
          type: [string, 'null']
          description: Opcional. Vacía o ausente → `null`.
        capacity:
          type: integer
          minimum: 1
          description: Obligatorio. Entero JSON >= 1 (ausente o inválido → 400 `InvalidTableCapacityError`).
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Opcional; por defecto `libre`.

    UpdateTableRequest:
      type: object
      required: [number, capacity, status]
      properties:
        number:
          type: integer
          minimum: 1
        description:
          type: [string, 'null']
          description: Opcional. Ausente, `null` o vacía → `null` (se borra la descripción).
        capacity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TableStatus'

    ChangeTableStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TableStatus'

    OccupyTableRequest:
      type: object
      required: [people]
      properties:
        people:
          type: integer
          minimum: 1
          description: Número de comensales; debe ser <= `capacity` de la mesa.

    CreateOrderRequest:
      type: object
      required: [restaurantId, tableId, items]
      properties:
        restaurantId:
          type: string
        tableId:
          type: string
          minLength: 1
          description: Id de una mesa del restaurante en estado `ocupada`. **Obligatorio.**
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
              quantity:
                type: integer
                minimum: 1
              notes:
                type: [string, 'null']

    OrderItem:
      type: object
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
        dishId:
          type: string
        quantity:
          type: integer
          description: Siempre 1 (los ítems se expanden al crear el pedido).
        notes:
          type: [string, 'null']
        status:
          type: string
          enum: [pendiente, preparando, listo, entregado]
        dishName:
          type: [string, 'null']
          description: Solo en lecturas (no en la respuesta de `POST /orders`).
        dishPrice:
          type: [number, 'null']
        dishCategory:
          type: [string, 'null']

    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id:
          type: string
        restaurantId:
          type: string
        tableId:
          type: [string, 'null']
          description: |
            Id de la mesa. Puede ser `null` o un texto libre en pedidos anteriores a esta
            funcionalidad; los nuevos siempre llevan el id de una mesa.
        tableNumber:
          type: integer
          description: |
            **Nuevo.** Número de la mesa (`restaurant_tables.number`). Se **omite** si
            `tableId` no corresponde a ninguna mesa existente (pedidos antiguos o mesa
            borrada). Mostrar con respaldo: `tableNumber ?? tableId`.
        clientId:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: [string, 'null']
          description: Solo en `GET /orders/{id}` y `GET /orders/mine`.
        restaurantLogoUrl:
          type: [string, 'null']
          description: Solo en `GET /orders/{id}` y `GET /orders/mine`.

    Error:
      type: object
      required: [error]
      description: |
        Cuerpo de error. Errores de dominio (rutas de mesas vía `errorHandler` y
        `POST /orders`): `error` es el nombre del error y `message` el texto. Middlewares
        de auth y el resto de handlers de `OrderController`: solo `error` con el mensaje.

        Errores de dominio de mesas (nombre → HTTP → `message` exacto):

        | `error` | HTTP | `message` |
        | --- | --- | --- |
        | `TableIdRequiredError` | 400 | `Table ID is required` |
        | `InvalidTableNumberError` | 400 | `Table number must be an integer greater than or equal to 1` |
        | `InvalidTableCapacityError` | 400 | `Table capacity must be an integer greater than or equal to 1` |
        | `InvalidTableStatusError` | 400 | `Table status is required` (ausente) o `Invalid table status: <valor>. Must be one of: libre, ocupada, reservada` |
        | `InvalidPeopleCountError` | 400 | `People count must be an integer greater than or equal to 1` |
        | `TableNotFoundError` | 404 | `Table not found` |
        | `DuplicatedTableNumberError` | 409 | `Table number is already in use in this restaurant` |
        | `TableNotAvailableError` | 409 | `Table is not available` |
        | `TableOccupiedError` | 409 | `Cannot delete an occupied table` |
      properties:
        error:
          type: string
        message:
          type: string
