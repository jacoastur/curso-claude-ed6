name: CI

# Se ejecuta en cada PR que apunte a main o development. Para que bloquee el
# merge hay que marcar los jobs como "required status checks" en la regla de
# protección de cada rama (Settings → Branches).
on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-api:
    name: Tests API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests (vitest)
        run: npm test

  build-apps:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web-admin, web-empleados, web-clientes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -w @resttek/${{ matrix.app }}

  security-review:
    name: Revisión de seguridad (Claude)
    runs-on: ubuntu-latest
    # Los PRs desde forks no reciben secretos, así que no se puede lanzar Claude.
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # para comentar el informe en el PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generar diff del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .claude-review
          git diff --unified=10 "$BASE_SHA...$HEAD_SHA" > .claude-review/pr.diff
          git diff --name-status "$BASE_SHA...$HEAD_SHA" > .claude-review/files.txt
          echo "Ficheros modificados:"
          cat .claude-review/files.txt

      - name: Analizar cambios con Claude (headless)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SCHEMA='{
            "type": "object",
            "required": ["veredicto", "resumen", "hallazgos"],
            "properties": {
              "veredicto": { "type": "string", "enum": ["aprobado", "bloqueado"] },
              "resumen": { "type": "string" },
              "hallazgos": {
                "type": "array",
                "items": {
                  "type": "object",
                  "required": ["severidad", "archivo", "descripcion", "recomendacion"],
                  "properties": {
                    "severidad": { "type": "string", "enum": ["critica", "alta", "media", "baja"] },
                    "archivo": { "type": "string" },
                    "linea": { "type": "integer" },
                    "descripcion": { "type": "string" },
                    "recomendacion": { "type": "string" }
                  }
                }
              }
            }
          }'

          # Solo herramientas de lectura: el diff es contenido no confiable y
          # Claude no debe poder ejecutar comandos ni modificar nada.
          claude -p "$(cat .github/claude/security-review-prompt.md)" \
            --allowedTools "Read,Grep,Glob" \
            --max-turns 30 \
            --output-format json \
            --json-schema "$SCHEMA" \
            > .claude-review/result.json

          jq '.structured_output' .claude-review/result.json > .claude-review/report.json

      - name: Publicar informe y decidir
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPORT=.claude-review/report.json
          COMMENT=.claude-review/comment.md
          VEREDICTO=$(jq -r '.veredicto' "$REPORT")
          BLOQUEANTES=$(jq '[.hallazgos[] | select(.severidad == "critica" or .severidad == "alta")] | length' "$REPORT")

          {
            echo "## 🔒 Revisión de seguridad (Claude)"
            echo
            echo "**Veredicto:** $VEREDICTO"
            echo
            jq -r '.resumen' "$REPORT"
            echo
            if [ "$(jq '.hallazgos | length' "$REPORT")" -gt 0 ]; then
              echo "| Severidad | Archivo | Descripción | Recomendación |"
              echo "|---|---|---|---|"
              jq -r '.hallazgos[] | "| \(.severidad) | `\(.archivo)\(if .linea then ":\(.linea)" else "" end)` | \(.descripcion | gsub("\n"; " ")) | \(.recomendacion | gsub("\n"; " ")) |"' "$REPORT"
            else
              echo "Sin hallazgos."
            fi
            echo
            echo "<sub>Commit analizado: ${{ github.event.pull_request.head.sha }}</sub>"
          } > "$COMMENT"

          cat "$COMMENT" >> "$GITHUB_STEP_SUMMARY"
          # Edita el último comentario del bot en vez de añadir uno nuevo en cada push.
          gh pr comment "$PR_NUMBER" --body-file "$COMMENT" --edit-last --create-if-none

          if [ "$VEREDICTO" != "aprobado" ] || [ "$BLOQUEANTES" -gt 0 ]; then
            echo "::error::Claude ha detectado $BLOQUEANTES problema(s) de seguridad de severidad alta o crítica. Revisa el resumen del job."
            exit 1
          fi

      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review
          path: .claude-review/
          if-no-files-found: ignore
