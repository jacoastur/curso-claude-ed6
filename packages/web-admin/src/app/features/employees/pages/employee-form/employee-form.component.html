<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>Nuevo empleado</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="firstName">Nombre</label>
        <input id="firstName" type="text" class="form-control" [(ngModel)]="form.firstName" name="firstName" required placeholder="Juan" />
      </div>

      <div class="form-group">
        <label for="lastName">Apellido</label>
        <input id="lastName" type="text" class="form-control" [(ngModel)]="form.lastName" name="lastName" required placeholder="Pérez" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" class="form-control" [(ngModel)]="form.email" name="email" required placeholder="juan@restaurante.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" [(ngModel)]="form.password" name="password" required placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label for="role">Rol</label>
        <select id="role" class="form-control" [(ngModel)]="form.role" name="role" required>
          @for (role of roles; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="listUrl" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Crear empleado
        }
      </button>
    </div>
  </form>
</div>
